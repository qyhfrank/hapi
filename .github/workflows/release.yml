name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build all platform binaries
        run: bun run build:single-exe:all

      - name: Prepare npm packages
        run: cd cli && bun run prepare-npm-packages

      - name: Rebrand packages for fork scope
        run: |
          find cli/npm -name 'package.json' -exec sed -i 's/@twsxtd/@frankqing/g' {} +
          sed -i 's/@twsxtd/@frankqing/g' cli/npm/main/bin/hapi.cjs
          sed -i 's|github.com/tiann/hapi|github.com/qyhfrank/hapi|g' cli/npm/main/bin/hapi.cjs

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PLATFORMS=("darwin-arm64" "darwin-x64" "linux-arm64" "linux-x64" "win32-x64")

          for platform in "${PLATFORMS[@]}"; do
              PKG="@frankqing/hapi-${platform}"
              if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
                  echo "${PKG}@${VERSION} already published, skipping"
              else
                  echo "Publishing ${PKG}@${VERSION}..."
                  npm publish --access public cli/npm/${platform}
              fi
          done

      - name: Publish main package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG="@frankqing/hapi"

          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "${PKG}@${VERSION} already published, skipping"
          else
              echo "Publishing ${PKG}@${VERSION}..."
              npm publish --access public cli/npm/main
          fi

      - name: Package release artifacts
        run: |
          cd cli/dist-exe
          mkdir -p ../release-artifacts

          for dir in bun-*/; do
              target="${dir%/}"
              # bun-darwin-arm64 -> hapi-darwin-arm64
              name="hapi-${target#bun-}"
              name="${name/windows/win32}"

              if [[ "$target" == *"windows"* ]]; then
                  zip -j "../release-artifacts/${name}.zip" "$target"/hapi.exe
              else
                  tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" hapi
              fi
          done

          cd ../release-artifacts
          sha256sum * > checksums.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
              --title "Release ${GITHUB_REF#refs/tags/}" \
              --generate-notes \
              cli/release-artifacts/*
